name: LauncherTests
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    ENABLE_HARDENED_RUNTIME: NO
targets:
  TLGLauncher:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      - path: Tests/Fixtures
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: world.eskaton.the-last-guardian-launcher
        ENABLE_TESTABILITY: YES
        INFOPLIST_FILE: Info.plist
  ProgressTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/Unit]
    dependencies:
      - target: TLGLauncher
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: world.eskaton.guardian.progress-tests
  ProgressUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/UI]
    dependencies:
      - target: TLGLauncher
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: world.eskaton.guardian.progress-ui-tests
        CODE_SIGN_ENTITLEMENTS: Tests/UI/ProgressUITests.entitlements
schemes:
  TLGLauncher:
    build:
      targets:
        TLGLauncher: all
    test:
      targets: [ProgressTests, ProgressUITests]
